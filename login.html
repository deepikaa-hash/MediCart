<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - MedEase</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>

    <!-- Login Page -->

    <div class="login-page">


        <!-- Left Section -->

        <div class="login-info">

            <div class="brand">
                <span>✚</span>
                MedEase
            </div>

            <div class="info-content">

                <p class="small-title">
                    YOUR HEALTH, OUR PRIORITY
                </p>

                <h1>
                    Healthcare
                    <span>made simple.</span>
                </h1>

                <p>
                    Access your account to order medicines,
                    track your orders and manage your
                    healthcare essentials.
                </p>

            </div>

        </div>


        <!-- Right Section -->

        <div class="login-container">

            <div class="login-box">

                <a href="index.html"
                   class="back-home">
                    ← Back to Home
                </a>


                <h2>Welcome back 👋</h2>

                <p class="login-subtitle">
                    Login to continue to MedEase
                </p>


                <!-- Login Form -->

                <form id="loginForm">


                    <!-- Email -->

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Remember + Forgot -->

                    <div class="login-options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="remember"
                            >

                            Remember me

                        </label>


                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="login-submit">

                        Login

                    </button>


                    <!-- Divider -->

                    <div class="divider">

                        <span></span>

                        <p>OR</p>

                        <span></span>

                    </div>


                    <!-- Google -->

                    <button
                        type="button"
                        class="google-btn">

                        <span>G</span>

                        Continue with Google

                    </button>


                    <!-- Sign Up -->

                    <p class="signup-text">

                        Don't have an account?

                        <a href="#">
                            Sign Up
                        </a>

                    </p>


                </form>

            </div>

        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email").value;


                const password =
                    document.getElementById("password").value;


                if (email === "" || password === "") {

                    alert(
                        "Please enter your email and password."
                    );

                    return;

                }


                alert(
                    "Login successful! Welcome to MedEase."
                );


                window.location.href =
                    "index.html";

            }
        );

    </script>

</body>

</html>
