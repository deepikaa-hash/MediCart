<!-- =========================
     PAYMENT METHOD
========================= -->

<div class="checkout-card">

    <div class="card-title">

        <div class="step-number">
            2
        </div>

        <div>

            <h2>
                Payment Method
            </h2>

            <p>
                Select how you want to pay.
            </p>

        </div>

    </div>


    <div class="payment-options">


        <!-- CASH ON DELIVERY -->

        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="cod"
                checked
            >

            <div>

                <strong>
                    💵 Cash on Delivery
                </strong>

                <span>
                    Pay when your order arrives
                </span>

            </div>

        </label>


        <!-- UPI -->

        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="upi"
            >

            <div>

                <strong>
                    📱 UPI
                </strong>

                <span>
                    Pay using your UPI app
                </span>

            </div>

        </label>


        <!-- CARD -->

        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="card"
            >

            <div>

                <strong>
                    💳 Card
                </strong>

                <span>
                    Credit or debit card
                </span>

            </div>

        </label>


    </div>

</div>



<!-- =========================
     DEMO PAYMENT SECTION
========================= -->

<div
    class="checkout-card"
    id="paymentDetails"
    style="display: none;">

    <div class="card-title">

        <div class="step-number">
            3
        </div>

        <div>

            <h2>
                Payment Details
            </h2>

            <p id="paymentDescription">
                Complete your payment.
            </p>

        </div>

    </div>


    <!-- UPI PAYMENT -->

    <div
        id="upiPayment"
        class="payment-detail-box"
        style="display: none;">

        <label>
            UPI ID
        </label>

        <input
            type="text"
            id="upiId"
            placeholder="example@upi"
        >

        <p>
            Demo payment — no real transaction will be made.
        </p>

    </div>


    <!-- CARD PAYMENT -->

    <div
        id="cardPayment"
        class="payment-detail-box"
        style="display: none;">

        <div class="form-grid">

            <div class="input-group full-width">

                <label>
                    Card Number
                </label>

                <input
                    type="text"
                    id="cardNumber"
                    placeholder="1234 5678 9012 3456"
                    maxlength="19"
                    inputmode="numeric"
                >

            </div>


            <div class="input-group">

                <label>
                    Expiry Date
                </label>

                <input
                    type="text"
                    id="expiry"
                    placeholder="MM/YY"
                    maxlength="5"
                >

            </div>


            <div class="input-group">

                <label>
                    CVV
                </label>

                <input
                    type="password"
                    id="cvv"
                    placeholder="123"
                    maxlength="3"
                    inputmode="numeric"
                >

            </div>

        </div>

        <p>
            Demo payment — do not enter real card details.
        </p>

    </div>


    <!-- COD -->

    <div
        id="codPayment"
        class="payment-detail-box">

        <div class="cod-message">

            💵

            <div>

                <strong>
                    Cash on Delivery
                </strong>

                <p>
                    You can pay when your medicine
                    order arrives at your doorstep.
                </p>

            </div>

        </div>

    </div>

</div>



<!-- =========================
     PLACE ORDER
========================= -->

<button
    type="button"
    id="placeOrder"
    class="place-order-btn">

    Place Order

</button>
